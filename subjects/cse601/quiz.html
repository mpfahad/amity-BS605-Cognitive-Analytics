}

}
.filters {

.chip {

}

  max-width: 100%;
}
.site-nav a {

  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  border-radius: 999px;
  padding: 0.4rem 0.85rem;
  font: inherit;
  font-weight: 700;
  font-size: 0.92rem;
  text-decoration: none;

.site-nav a:hover { background: var(--accent-soft); color: var(--accent); }

.site-nav a.here {

.stat {
  background: rgba(255,255,255,0.75);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.8rem;

.stat span { color: var(--muted); font-size: 0.88rem; }
.prog-line {
  margin-top: 0.55rem;
  height: 7px;
  border-radius: 999px;
  background: rgba(21,35,28,0.08);
  overflow: hidden;

.prog-line > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #2f9e74);
  border-radius: inherit;

.links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0.5rem;
  margin-top: 0.8rem;

.links a {

  text-decoration: none;

  background: linear-gradient(135deg, #fff4ec, #ffe8d8);
  border-color: rgba(196,92,38,0.25);

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes flipIn {
  from { opacity: 0; transform: rotateX(-8deg) translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (max-width: 720px) {
  .wrap { width: min(100% - 1.2rem, 1120px); }

.progress {
  height: 8px; border-radius: 999px; background: rgba(21,35,28,0.08); overflow: hidden;
}
.progress > span {
  display: block; height: 100%; width: 0%;

  transition: width 0.25s ease;

.quiz-layout { display: grid; gap: 1rem; }
.qcard {

  background: rgba(255,255,255,0.82);

  box-shadow: var(--shadow);

  display: flex; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap;

.qnum {

}
.qtext {

  line-height: 1.3;
  margin: 0 0 0.9rem;

.options { display: grid; gap: 0.55rem; }
.opt {

  text-align: left;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 14px;
  padding: 0.75rem 0.85rem;

  border-radius: 50%;
  display: grid; place-items: center;

  color: var(--accent);
  font-weight: 700;
  font-size: 0.82rem;

.opt.correct {
  border-color: rgba(31,122,77,0.55);
  background: #e8f7ef;
}
.opt.wrong {
  border-color: rgba(163,59,59,0.45);
  background: #fdeeee;
}
.opt:disabled { cursor: default; }
.explain {
  margin-top: 0.85rem;
  padding: 0.75rem 0.85rem;
  border-radius: 12px;
  background: #f2f7f4;

.scorebar {

.score {

}
.footer-nav {
  display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: space-between; margin-top: 0.8rem;

ion.", "detail": "5.1.1 · concept"}, {"front": "Also remember (Green Technology)", "back": "Connect to choosing efficient algorithms over naïve ones.", "detail": "5.1.1 · concept"}], "mcqs": [{"q": "Which statement best matches Green Technology?", "options": ["A core idea in Data Structures & Algorithms: Green Technology", "Unrelated to Module 5", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Data Structures & Algorithms"], "answer": 0, "explain": "Green Technology is a syllabus topic under Polynomial Time in Module 5."}]}, {"id": "5.1.2", "title": "Hamiltonian Cycles", "flashcards": [{"front": "What is Hamiltonian cycle?", "back": "Cycle visiting each vertex exactly once and returning.", "detail": "5.1.2 · Hamiltonian Cycles"}, {"front": "What is Hardness?", "back": "Deciding existence is NP-complete (classic).", "detail": "5.1.2 · Hamiltonian Cycles"}, {"front": "What about Vs Euler tour?", "back": "Euler uses every edge; Hamiltonian every vertex.", "detail": "5.1.2 · key idea"}, {"front": "Also remember (Hamiltonian Cycles)", "back": "TSP optimisation builds on Hamiltonian ideas.", "detail": "5.1.2 · concept"}], "mcqs": [{"q": "Which statement best matches Hamiltonian Cycles?", "options": ["A core idea in Data Structures & Algorithms: Hamiltonian Cycles", "Only a programming-language keyword with no syllabus meaning", "Unrelated to Module 5", "A definition-only label with no role in Data Structures & Algorithms"], "answer": 0, "explain": "Hamiltonian Cycles is a syllabus topic under Polynomial Time in Module 5."}]}, {"id": "5.2.1", "title": "NP-completeness Proofs", "flashcards": [{"front": "What is NP-completeness proof?", "back": "Show problem in NP + polynomial reduction from known NP-complete problem.", "detail": "5.2.1 · NP-completeness Proofs"}, {"front": "What is Certificate?", "back": "Short verifiable witness for yes instances (for NP).", "detail": "5.2.1 · NP-completeness Proofs"}, {"front": "What about Reduction direction?", "back": "known hard ≤p your problem.", "detail": "5.2.1 · key idea"}, {"front": "Also remember (NP-completeness Proofs)", "back": "Polynomial-time verification ≠ polynomial-time solving.", "detail": "5.2.1 · concept"}], "mcqs": [{"q": "Which statement best matches NP-completeness Proofs?", "options": ["A core idea in Data Structures & Algorithms: NP-completeness Proofs", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Data Structures & Algorithms", "Unrelated to Module 5"], "answer": 0, "explain": "NP-completeness Proofs is a syllabus topic under NP-Completeness in Module 5."}]}, {"id": "5.2.2", "title": "NP-completeness Problems", "flashcards": [{"front": "What is NP-complete problems?", "back": "Hardest problems in NP (under poly reductions).", "detail": "5.2.2 · NP-completeness Problems"}, {"front": "What is Examples?", "back": "SAT, vertex cover decision, Hamiltonian cycle, subset-sum, …", "detail": "5.2.2 · NP-completeness Problems"}, {"front": "Key idea (NP-completeness Problems)", "back": "If any NP-complete problem has poly algorithm, P=NP.", "detail": "5.2.2 · concept"}, {"front": "Also remember (NP-completeness Problems)", "back": "Practice recognising ‘decision version’ wording.", "detail": "5.2.2 · concept"}], "mcqs": [{"q": "Which statement best matches NP-completeness Problems?", "options": ["A definition-only label with no role in Data Structures & Algorithms", "A core idea in Data Structures & Algorithms: NP-completeness Problems", "Unrelated to Module 5", "Only a programming-language keyword with no syllabus meaning"], "answer": 1, "explain": "NP-completeness Problems is a syllabus topic under NP-Completeness in Module 5."}]}, {"id": "5.2.3", "title": "NP-Hard and SAT Problems", "flashcards": [{"front": "What is NP-hard?", "back": "At least as hard as NP-complete; may not be in NP.", "detail": "5.2.3 · NP-Hard and SAT Problems"}, {"front": "What is SAT?", "back": "Satisfiability of Boolean formulas — central NP-complete problem.", "detail": "5.2.3 · NP-Hard and SAT Problems"}, {"front": "Key idea (NP-Hard and SAT Problems)", "back": "NP-hard includes problems outside NP (e.g. some optimisation/undecidable-adjacent teaching examples).", "detail": "5.2.3 · concept"}, {"front": "Also remember (NP-Hard and SAT Problems)", "back": "SAT is the usual reduction source.", "detail": "5.2.3 · concept"}], "mcqs": [{"q": "Which statement best matches NP-Hard and SAT Problems?", "options": ["Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Data Structures & Algorithms", "Unrelated to Module 5", "A core idea in Data Structures & Algorithms: NP-Hard and SAT Problems"], "answer": 3, "explain": "NP-Hard and SAT Problems is a syllabus topic under NP-Completeness in Module 5."}]}, {"id": "5.2.4", "title": "NP-completeness and Reducibility", "flashcards": [{"front": "What is Reducibility?", "back": "Problem A ≤p B if A transforms to B in poly time.", "detail": "5.2.4 · NP-completeness and Reducibility"}, {"front": "What is Meaning?", "back": "B is at least as hard as A (for hardness proofs).", "detail": "5.2.4 · NP-completeness and Reducibility"}, {"front": "Key idea (NP-completeness and Reducibility)", "back": "Cook–Levin historically links SAT to NP-completeness theory.", "detail": "5.2.4 · concept"}, {"front": "Also remember (NP-completeness and Reducibility)", "back": "Always state what reduces to what.", "detail": "5.2.4 · concept"}], "mcqs": [{"q": "Which statement best matches NP-completeness and Reducibility?", "options": ["A definition-only label with no role in Data Structures & Algorithms", "A core idea in Data Structures & Algorithms: NP-completeness and Reducibility", "Unrelated to Module 5", "Only a programming-language keyword with no syllabus meaning"], "answer": 1, "explain": "NP-completeness and Reducibility is a syllabus topic under NP-Completeness in Module 5."}]}]}]};
const bank = [];
DATA.modules.forEach(m => {
  m.topics.forEach(t => {
    (t.mcqs || []).forEach((q, i) => {
      bank.push({
        moduleId: m.id,
        moduleTitle: m.title,
        topicId: t.id,
        topicTitle: t.title,
        q: q.q,
        options: q.options,
        answer: q.answer,
        explain: q.explain || "",
        id: m.id + "-" + t.id + "-q" + i
      });
    });
  });
});

let activeModule = "all";
let order = bank.map((_, i) => i);
let filteredIds = order.slice();
let index = 0;
const state = {};
let restoring = false;

const el = id => document.getElementById(id);
const quizProgressBar = el("quizProgressBar");

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentList() { return filteredIds.map(i => bank[i]); }

function persistQuiz() {
  if (restoring) return;
  const P = window.AmityProgress || window.BS605Progress;
  if (!P || !window.__AMITY_SYNC_READY) return;
  P.saveSection("quiz", {
    activeModule: String(activeModule),
    index: index,
    answers: { ...state },
    filteredIds: filteredIds.slice(),
    order: order.slice()
  });
}

function restoreQuiz(payload) {
  if (!payload || !payload.quiz) return;
  restoring = true;
  const q = payload.quiz;
  if (q.activeModule !== undefined) activeModule = String(q.activeModule);
  Object.keys(state).forEach(k => delete state[k]);
  if (q.answers && typeof q.answers === "object") {
    Object.entries(q.answers).forEach(([k, v]) => { state[k] = v; });
  }
  if (Array.isArray(q.order) && q.order.length === bank.length) order = q.order.slice();
  applyFilter(true);
  if (Array.isArray(q.filteredIds) && q.filteredIds.length) {
    const allowed = new Set(bank.map((_, i) => i).filter(i => activeModule === "all" || String(bank[i].moduleId) === String(activeModule)));
    filteredIds = q.filteredIds.filter(i => allowed.has(i));
    if (!filteredIds.length) applyFilter(false);
  }
  if (typeof q.index === "number" && filteredIds.length) {
    index = Math.max(0, Math.min(filteredIds.length - 1, q.index));
  }
  el("totalQ").textContent = filteredIds.length;
  renderFilters();
  renderStats();
  renderQuestion();
  updateScore();
  restoring = false;
}

function applyFilter(preserveShuffle=false) {
  const base = bank.map((q, i) => ({q, i})).filter(x => activeModule === "all" || String(x.q.moduleId) === String(activeModule)).map(x => x.i);
  filteredIds = preserveShuffle ? order.filter(i => base.includes(i)) : base;
  if (!preserveShuffle) order = bank.map((_, i) => i);
  index = 0;
  el("totalQ").textContent = filteredIds.length;
  renderFilters();
  renderStats();
  renderQuestion();
  updateScore();
  persistQuiz();
}

function renderFilters() {
  const box = el("moduleFilters");
  const mods = [{id:"all", title:"All modules"}, ...DATA.modules.map(m => ({id:String(m.id), title:"Module "+m.id}))];
  box.innerHTML = mods.map(m => `<button type="button" class="chip ${String(activeModule)===String(m.id)?"active":""}" data-m="${m.id}">${m.title}</button>`).join("");
  box.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    activeModule = btn.dataset.m;
    applyFilter(false);
  }));
}

function renderStats() {
  const box = el("moduleStats");
  box.innerHTML = DATA.modules.map(m => {
    const qs = bank.filter(q => q.moduleId === m.id);
    const attempted = qs.filter(q => state[q.id] !== undefined).length;
    const correct = qs.filter(q => state[q.id] === q.answer).length;
    const pct = qs.length ? Math.round((attempted / qs.length) * 100) : 0;
    return `<div class="stat"><b>${correct}/${qs.length}</b><span>Module ${m.id} · ${attempted} answered</span><div class="prog-line"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function updateScore() {
  const list = currentList();
  const attempted = list.filter(q => state[q.id] !== undefined).length;
  const correct = list.filter(q => state[q.id] === q.answer).length;
  el("attempted").textContent = attempted;
  el("scoreNow").textContent = correct;
  el("accuracy").textContent = attempted ? Math.round((correct / attempted) * 100) + "%" : "—";
  quizProgressBar.style.width = list.length ? ((attempted / list.length) * 100) + "%" : "0%";
  renderStats();
}

function renderQuestion() {
  const list = currentList();
  if (!list.length) {
    el("qtext").textContent = "No questions in this filter.";
    el("options").innerHTML = "";
    el("explain").classList.remove("show");
    el("qnum").textContent = "";
    return;
  }
  const q = list[index];
  el("qnum").textContent = `Question ${index+1} of ${list.length}`;
  el("qtopic").textContent = `M${q.moduleId} · ${q.topicId} · ${q.topicTitle}`;
  el("qtext").textContent = q.q;
  const chosen = state[q.id];
  const letters = ["A","B","C","D"];
  el("options").innerHTML = q.options.map((opt, i) => {
    let cls = "opt";
    if (chosen !== undefined) {
      if (i === q.answer) cls += " correct";
      else if (i === chosen) cls += " wrong";
    }
    return `<button type="button" class="${cls}" data-i="${i}" ${chosen!==undefined?"disabled":""}><span class="letter">${letters[i]}</span><span>${opt.replace(/^[A-D]\.\s*/, "")}</span></button>`;
  }).join("");
  el("options").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    state[q.id] = Number(btn.dataset.i);
    renderQuestion();
    updateScore();
    persistQuiz();
  }));
  const explain = el("explain");
  if (chosen !== undefined) {
    const ok = chosen === q.answer;
    explain.textContent = (ok ? "Correct. " : "Not quite. ") + (q.explain || "");
    explain.classList.add("show");
  } else {
    explain.classList.remove("show");
    explain.textContent = "";
  }
}

el("nextBtn").addEventListener("click", () => {
  const list = currentList();
  if (!list.length) return;
  index = (index + 1) % list.length;
  renderQuestion();
  persistQuiz();
});
el("prevBtn").addEventListener("click", () => {
  const list = currentList();
  if (!list.length) return;
  index = (index - 1 + list.length) % list.length;
  renderQuestion();
  persistQuiz();
});
el("resetBtn").addEventListener("click", () => {
  Object.keys(state).forEach(k => delete state[k]);
  updateScore();
  renderQuestion();
  persistQuiz();
});
el("shuffleBtn").addEventListener("click", () => {
  const base = bank.map((q, i) => i).filter(i => activeModule === "all" || String(bank[i].moduleId) === String(activeModule));
  filteredIds = shuffle(base);
  order = shuffle(bank.map((_, i) => i));
  index = 0;
  renderQuestion();
  persistQuiz();
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") el("nextBtn").click();
  if (e.key === "ArrowLeft") el("prevBtn").click();
  const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  if (map[e.key.toLowerCase()] !== undefined) {
    const btn = el("options").querySelector(`[data-i="${map[e.key.toLowerCase()]}"]`);
    if (btn && !btn.disabled) btn.click();
  }
});

applyFilter(false);

function bootSync(restoreFn) {
  const SUBJECT = "cse601";
  function apply(subPayload) {
    if (subPayload && restoreFn) restoreFn(subPayload);
    window.__AMITY_SYNC_READY = true;
    window.__BS605_SYNC_READY = true;
  }
  const P = window.AmityProgress || window.BS605Progress;
  const UI = window.AmitySyncUI || window.BS605SyncUI;
  if (UI) {
    UI.mount(document.getElementById("amity-sync-root"), {
      subjectLabel: "CSE601",
      onLoaded: (sub) => apply(sub),
      onReady: (sub) => {
        if (window.__AMITY_SYNC_READY) return;
        const local = P && P.readLocalCache && P.readLocalCache();
        const fallback = sub || (P && P.getSubjectPayload && P.getSubjectPayload(local?.payload, SUBJECT)) || null;
        apply(fallback);
      }
    });
  } else {
    const local = P && P.readLocalCache && P.readLocalCache();
    apply(P && P.getSubjectPayload ? P.getSubjectPayload(local?.payload, SUBJECT) : null);
  }
}

bootSync(restoreQuiz);
</script>
