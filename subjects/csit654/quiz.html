.filters {

  font: inherit;

.chip.active {
  background: var(--accent);

.chip.lmr {

.site-nav a {

  background: transparent;

.stat {
  background: rgba(255,255,255,0.75);
  border: 1px solid var(--line);

.stat span { color: var(--muted); font-size: 0.88rem; }
.prog-line {

  height: 7px;
  border-radius: 999px;
  background: rgba(21,35,28,0.08);
  overflow: hidden;

.prog-line > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #2f9e74);
  border-radius: inherit;

.links {

  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0.5rem;
  margin-top: 0.8rem;

.links a {

  font-size: 0.92rem;

.links a.lmr-link {
  background: linear-gradient(135deg, #fff4ec, #ffe8d8);

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes flipIn {
  from { opacity: 0; transform: rotateX(-8deg) translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (max-width: 720px) {
  .wrap { width: min(100% - 1.2rem, 1120px); }

.progress {
  height: 8px; border-radius: 999px; background: rgba(21,35,28,0.08); overflow: hidden;
}
.progress > span {
  display: block; height: 100%; width: 0%;

.quiz-layout { display: grid; gap: 1rem; }
.qcard {
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.82);
  border-radius: var(--radius);
  padding: 1.1rem 1.15rem;
  box-shadow: var(--shadow);
  animation: flipIn 0.35s ease both;

.qhead {
  display: flex; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap;

.qnum {
  font-weight: 700; color: var(--accent); font-size: 0.85rem; letter-spacing: 0.03em;
}
.qtext {

  font-size: clamp(1.15rem, 2vw, 1.4rem);
  line-height: 1.3;
  margin: 0 0 0.9rem;

.options { display: grid; gap: 0.55rem; }
.opt {
  display: flex; gap: 0.7rem; align-items: flex-start;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 14px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  font: inherit;

.opt:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(15,107,76,0.35); }
.opt .letter {
  flex: 0 0 auto;
  width: 1.55rem; height: 1.55rem;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
  font-size: 0.82rem;
}
.opt.correct {
  border-color: rgba(31,122,77,0.55);
  background: #e8f7ef;
}
.opt.wrong {
  border-color: rgba(163,59,59,0.45);
  background: #fdeeee;
}
.opt:disabled { cursor: default; }
.explain {
  margin-top: 0.85rem;
  padding: 0.75rem 0.85rem;
  border-radius: 12px;
  background: #f2f7f4;
  color: var(--muted);

.explain.show { display: block; }
.scorebar {
  display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; justify-content: space-between;

.score {
  font-family: var(--font-display);
  font-size: 1.4rem;
}
.footer-nav {
  display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: space-between; margin-top: 0.8rem;
}
</style>

age via timing, power, EM — attacks beyond pure maths of the cipher.", "detail": "1.1.9 · Overview of Hardware Security"}, {"front": "What is Hardware Root of Trust?", "back": "Immutable/boot-anchored component that verifies later software stages.", "detail": "1.1.9 · Overview of Hardware Security"}, {"front": "Key idea (Overview of Hardware Security)", "back": "Software crypto can be correct yet leak via side channels on real hardware.", "detail": "1.1.9 · concept"}, {"front": "Also remember (Overview of Hardware Security)", "back": "Secure boot chains trust from ROM/firmware upward.", "detail": "1.1.9 · concept"}], "mcqs": [{"q": "Which statement best matches Overview of Hardware Security?", "options": ["A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Overview of Hardware Security", "Only a programming-language keyword with no syllabus meaning", "Unrelated to Module 1"], "answer": 1, "explain": "Overview of Hardware Security is a syllabus topic under Network security in Module 1."}]}]}, {"id": 2, "title": "Module 2", "topics": [{"id": "2.1.1", "title": "Modern Block Ciphers: Block Ciphers Principles", "flashcards": [{"front": "What is Block cipher?", "back": "Keyed invertible transformation on n-bit blocks (typical n=64 or 128).", "detail": "2.1.1 · Modern Block Ciphers: Block Ciphers Principles"}, {"front": "What is Product cipher?", "back": "Composition of substitutions and permutations (Shannon-style).", "detail": "2.1.1 · Modern Block Ciphers: Block Ciphers Principles"}, {"front": "What is Round?", "back": "Repeated keyed mixing step; more rounds increase diffusion/confusion cost.", "detail": "2.1.1 · Modern Block Ciphers: Block Ciphers Principles"}, {"front": "What is Key schedule?", "back": "Derives round keys from the master key.", "detail": "2.1.1 · Modern Block Ciphers: Block Ciphers Principles"}, {"front": "What is Ideal properties?", "back": "Pseudorandom permutation behaviour under secret key; avalanche effect.", "detail": "2.1.1 · Modern Block Ciphers: Block Ciphers Principles"}, {"front": "What about Principles?", "back": "confusion + diffusion realised via SPN or Feistel structures.", "detail": "2.1.1 · key idea"}], "mcqs": [{"q": "Which statement best matches Modern Block Ciphers: Block Ciphers Principles?", "options": ["Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Modern Block Ciphers: Block Ciphers Principles", "Unrelated to Module 2"], "answer": 2, "explain": "Modern Block Ciphers: Block Ciphers Principles is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.2", "title": "Shannon’s Theory of Confusion and Diffusion", "flashcards": [{"front": "What is Confusion?", "back": "Make the relationship between ciphertext and key as complex as possible.", "detail": "2.1.2 · Shannon’s Theory of Confusion and Diffusion"}, {"front": "What is Diffusion?", "back": "Spread plaintext statistical structure over many ciphertext bits.", "detail": "2.1.2 · Shannon’s Theory of Confusion and Diffusion"}, {"front": "What is Substitution?", "back": "Primary tool for confusion (S-boxes).", "detail": "2.1.2 · Shannon’s Theory of Confusion and Diffusion"}, {"front": "What is Permutation / linear mixing?", "back": "Primary tool for diffusion (P-boxes, MixColumns).", "detail": "2.1.2 · Shannon’s Theory of Confusion and Diffusion"}, {"front": "What is Avalanche effect?", "back": "Small input change yields large, unpredictable output change.", "detail": "2.1.2 · Shannon’s Theory of Confusion and Diffusion"}, {"front": "What about Shannon?", "back": "both properties needed; either alone is insufficient against cryptanalysis.", "detail": "2.1.2 · key idea"}], "mcqs": [{"q": "Which statement best matches Shannon’s Theory of Confusion and Diffusion?", "options": ["A definition-only label with no role in Network Security & Cryptography", "Only a programming-language keyword with no syllabus meaning", "Unrelated to Module 2", "A core idea in Network Security & Cryptography: Shannon’s Theory of Confusion and Diffusion"], "answer": 3, "explain": "Shannon’s Theory of Confusion and Diffusion is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.3", "title": "Fiestal Structure", "flashcards": [{"front": "What is Feistel structure?", "back": "Split block into L∥R; round function F updates one half using the other + round key.", "detail": "2.1.3 · Fiestal Structure"}, {"front": "What is Round function F?", "back": "Need not be invertible; overall Feistel cipher remains invertible.", "detail": "2.1.3 · Fiestal Structure"}, {"front": "What is Swap / combine?", "back": "Classic: L_i = R_{i−1}; R_i = L_{i−1} ⊕ F(R_{i−1}, K_i).", "detail": "2.1.3 · Fiestal Structure"}, {"front": "What is Decryption?", "back": "Same structure with reverse round-key order — major engineering advantage.", "detail": "2.1.3 · Fiestal Structure"}, {"front": "What is DES as Feistel?", "back": "16-round Feistel network with 64-bit block (56-bit effective key).", "detail": "2.1.3 · Fiestal Structure"}, {"front": "What about Feistel vs SPN?", "back": "Feistel encrypts one half per round; SPN mixes the whole block each round.", "detail": "2.1.3 · key idea"}], "mcqs": [{"q": "Which statement best matches Fiestal Structure?", "options": ["A core idea in Network Security & Cryptography: Fiestal Structure", "Only a programming-language keyword with no syllabus meaning", "Unrelated to Module 2", "A definition-only label with no role in Network Security & Cryptography"], "answer": 0, "explain": "Fiestal Structure is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.4", "title": "Data Encryption Standard (DES)", "flashcards": [{"front": "What is DES?", "back": "64-bit block Feistel cipher; 56-bit effective key (+8 parity bits in 64-bit keying material).", "detail": "2.1.4 · Data Encryption Standard (DES)"}, {"front": "What is Initial / Final permutation?", "back": "IP and FP (IP⁻¹) bookend the 16 Feistel rounds.", "detail": "2.1.4 · Data Encryption Standard (DES)"}, {"front": "What is f-function?", "back": "Expansion E, XOR round key, 8 S-boxes, then permutation P.", "detail": "2.1.4 · Data Encryption Standard (DES)"}, {"front": "What is S-box?", "back": "Nonlinear 6→4 bit substitution — primary DES confusion source.", "detail": "2.1.4 · Data Encryption Standard (DES)"}, {"front": "What is Round keys?", "back": "48-bit subkeys from key schedule (PC-1, rotations, PC-2).", "detail": "2.1.4 · Data Encryption Standard (DES)"}, {"front": "Effective security is ~56-bit key?", "back": "historically breakable by brute force.", "detail": "2.1.4 · key idea"}], "mcqs": [{"q": "Which statement best matches Data Encryption Standard (DES)?", "options": ["Unrelated to Module 2", "A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Data Encryption Standard (DES)", "Only a programming-language keyword with no syllabus meaning"], "answer": 2, "explain": "Data Encryption Standard (DES) is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.5", "title": "Strength of DES", "flashcards": [{"front": "What is Brute-force vulnerability?", "back": "2^56 key space is searchable with specialised hardware (DES cracker era).", "detail": "2.1.5 · Strength of DES"}, {"front": "What is Complementary property?", "back": "DES has a known complementary relationship exploitable in some analyses.", "detail": "2.1.5 · Strength of DES"}, {"front": "What is Weak / semi-weak keys?", "back": "Pathological keys with poor schedule behaviour (must be avoided).", "detail": "2.1.5 · Strength of DES"}, {"front": "What is Analytical attacks?", "back": "Differential and linear cryptanalysis reduce complexity vs pure brute force (still costly for full DES).", "detail": "2.1.5 · Strength of DES"}, {"front": "Key idea (Strength of DES)", "back": "Practical insecurity today is mainly short key length, not failure of Feistel idea.", "detail": "2.1.5 · concept"}, {"front": "Also remember (Strength of DES)", "back": "3DES lengthens effective keying to extend life of DES hardware/software.", "detail": "2.1.5 · concept"}], "mcqs": [{"q": "Which statement best matches Strength of DES?", "options": ["A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Strength of DES", "Unrelated to Module 2", "Only a programming-language keyword with no syllabus meaning"], "answer": 1, "explain": "Strength of DES is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.6", "title": "Idea of Differential Cryptanalysis", "flashcards": [{"front": "What is Differential cryptanalysis?", "back": "Study how differences in plaintext pairs propagate to ciphertext differences.", "detail": "2.1.6 · Idea of Differential Cryptanalysis"}, {"front": "What is Differential?", "back": "Chosen ΔP and observed ΔC statistics that leak key bits of S-boxes/rounds.", "detail": "2.1.6 · Idea of Differential Cryptanalysis"}, {"front": "What is Characteristic?", "back": "Predicted difference path through rounds with some probability.", "detail": "2.1.6 · Idea of Differential Cryptanalysis"}, {"front": "What is Chosen-plaintext flavour?", "back": "Typically needs many chosen pairs to amplify probabilistic biases.", "detail": "2.1.6 · Idea of Differential Cryptanalysis"}, {"front": "Key idea (Idea of Differential Cryptanalysis)", "back": "Attacks nonlinear components (S-boxes) via difference distribution tables.", "detail": "2.1.6 · concept"}, {"front": "DES S-boxes resist DC better than random boxes?", "back": "design target.", "detail": "2.1.6 · key idea"}], "mcqs": [{"q": "Which statement best matches Idea of Differential Cryptanalysis?", "options": ["A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 2", "A core idea in Network Security & Cryptography: Idea of Differential Cryptanalysis", "Only a programming-language keyword with no syllabus meaning"], "answer": 2, "explain": "Idea of Differential Cryptanalysis is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.7", "title": "Block Cipher Modes of Operations", "flashcards": [{"front": "What is ECB?", "back": "Independent encryption of each block — identical plaintext blocks → identical ciphertext.", "detail": "2.1.7 · Block Cipher Modes of Operations"}, {"front": "What is CBC?", "back": "C_i = E_K(P_i ⊕ C_{i−1}); needs IV; hides patterns better than ECB.", "detail": "2.1.7 · Block Cipher Modes of Operations"}, {"front": "What is CFB / OFB?", "back": "Stream-like modes from a block cipher; CFB self-synchronising; OFB keystream independent of plaintext.", "detail": "2.1.7 · Block Cipher Modes of Operations"}, {"front": "What is CTR?", "back": "Encrypt counter values to make a keystream; parallelisable; never reuse counter under same key.", "detail": "2.1.7 · Block Cipher Modes of Operations"}, {"front": "What is IV / nonce?", "back": "Initialisation vector or unique counter start — secrecy less critical than uniqueness (mode-dependent).", "detail": "2.1.7 · Block Cipher Modes of Operations"}, {"front": "What about Mode ≠ algorithm?", "back": "AES-CBC is AES used in CBC mode.", "detail": "2.1.7 · key idea"}], "mcqs": [{"q": "Which statement best matches Block Cipher Modes of Operations?", "options": ["A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 2", "A core idea in Network Security & Cryptography: Block Cipher Modes of Operations", "Only a programming-language keyword with no syllabus meaning"], "answer": 2, "explain": "Block Cipher Modes of Operations is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.1.8", "title": "Triple DES", "flashcards": [{"front": "What is Triple DES (3DES)?", "back": "Apply DES three times: typically EDE (encrypt–decrypt–encrypt) with 2 or 3 keys.", "detail": "2.1.8 · Triple DES"}, {"front": "What is Two-key 3DES?", "back": "K1–K2–K1 pattern; intended ~112-bit security (meet-in-the-middle caveats).", "detail": "2.1.8 · Triple DES"}, {"front": "What is Three-key 3DES?", "back": "Independent K1,K2,K3 — strongest 3DES variant.", "detail": "2.1.8 · Triple DES"}, {"front": "What is Why EDE?", "back": "Compatibility: if K1=K2=K3, 3DES collapses to single DES for legacy interop.", "detail": "2.1.8 · Triple DES"}, {"front": "3DES block size remains 64 bits?", "back": "birthday bound limits large-volume use.", "detail": "2.1.8 · key idea"}, {"front": "Also remember (Triple DES)", "back": "Slower than AES; modern guidance prefers AES-128/256.", "detail": "2.1.8 · concept"}], "mcqs": [{"q": "Which statement best matches Triple DES?", "options": ["Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Triple DES", "Unrelated to Module 2", "A definition-only label with no role in Network Security & Cryptography"], "answer": 1, "explain": "Triple DES is a syllabus topic under Secret Key Cryptography in Module 2."}]}, {"id": "2.2.1", "title": "Advanced Encryption Standard (AES)", "flashcards": [{"front": "What is AES?", "back": "Rijndael-based SPN standard: 128-bit block; keys 128/192/256 → 10/12/14 rounds.", "detail": "2.2.1 · Advanced Encryption Standard (AES)"}, {"front": "What is SubBytes?", "back": "Nonlinear byte substitution via S-box (confusion).", "detail": "2.2.1 · Advanced Encryption Standard (AES)"}, {"front": "What is ShiftRows?", "back": "Row-wise byte rotation (helps diffusion).", "detail": "2.2.1 · Advanced Encryption Standard (AES)"}, {"front": "What is MixColumns?", "back": "Column mixing over GF(2^8) (diffusion); omitted in final round.", "detail": "2.2.1 · Advanced Encryption Standard (AES)"}, {"front": "What is AddRoundKey?", "back": "XOR state with round key.", "detail": "2.2.1 · Advanced Encryption Standard (AES)"}, {"front": "What about AES is not Feistel?", "back": "full-block layers each round.", "detail": "2.2.1 · key idea"}], "mcqs": [{"q": "Which statement best matches Advanced Encryption Standard (AES)?", "options": ["A core idea in Network Security & Cryptography: Advanced Encryption Standard (AES)", "Unrelated to Module 2", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography"], "answer": 0, "explain": "Advanced Encryption Standard (AES) is a syllabus topic under Public Key Cryptography in Module 2."}]}, {"id": "2.2.2", "title": "Fermat’s and Euler’s Theorem", "flashcards": [{"front": "What is Fermat’s Little Theorem?", "back": "If p prime and gcd(a,p)=1, then a^(p−1) ≡ 1 (mod p).", "detail": "2.2.2 · Fermat’s and Euler’s Theorem"}, {"front": "What is Euler’s totient φ(n)?", "back": "Count of integers in 1..n−1 coprime to n.", "detail": "2.2.2 · Fermat’s and Euler’s Theorem"}, {"front": "What is Euler’s theorem?", "back": "If gcd(a,n)=1, then a^φ(n) ≡ 1 (mod n).", "detail": "2.2.2 · Fermat’s and Euler’s Theorem"}, {"front": "What is Use in RSA?", "back": "Encryption/decryption exponents related via e·d ≡ 1 (mod φ(n)).", "detail": "2.2.2 · Fermat’s and Euler’s Theorem"}, {"front": "Key idea (Fermat’s and Euler’s Theorem)", "back": "Fermat is the special case of Euler when n is prime (φ(p)=p−1).", "detail": "2.2.2 · concept"}, {"front": "Also remember (Fermat’s and Euler’s Theorem)", "back": "These theorems justify why RSA decryption undoes encryption under modular exponentiation.", "detail": "2.2.2 · concept"}], "mcqs": [{"q": "Which statement best matches Fermat’s and Euler’s Theorem?", "options": ["Unrelated to Module 2", "A core idea in Network Security & Cryptography: Fermat’s and Euler’s Theorem", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography"], "answer": 1, "explain": "Fermat’s and Euler’s Theorem is a syllabus topic under Public Key Cryptography in Module 2."}]}, {"id": "2.2.3", "title": "Chinese Remainder Theorem", "flashcards": [{"front": "What is Chinese Remainder Theorem (CRT)?", "back": "System x≡a_i (mod m_i) has unique solution mod M=∏m_i if moduli pairwise coprime.", "detail": "2.2.3 · Chinese Remainder Theorem"}, {"front": "What is Constructive use?", "back": "Combine residues to recover x modulo product of moduli.", "detail": "2.2.3 · Chinese Remainder Theorem"}, {"front": "What is RSA speedup?", "back": "Compute mod p and mod q separately, then CRT-combine for decryption.", "detail": "2.2.3 · Chinese Remainder Theorem"}, {"front": "What is Pairwise coprime?", "back": "Necessary condition for the standard unique CRT statement.", "detail": "2.2.3 · Chinese Remainder Theorem"}, {"front": "Key idea (Chinese Remainder Theorem)", "back": "CRT reduces large modular exponentiation to two smaller ones in RSA.", "detail": "2.2.3 · concept"}, {"front": "Also remember (Chinese Remainder Theorem)", "back": "Also used in some secret-sharing / multiprime constructions.", "detail": "2.2.3 · concept"}], "mcqs": [{"q": "Which statement best matches Chinese Remainder Theorem?", "options": ["Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Chinese Remainder Theorem", "A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 2"], "answer": 1, "explain": "Chinese Remainder Theorem is a syllabus topic under Public Key Cryptography in Module 2."}]}, {"id": "2.2.4", "title": "Principals of Public Key Crypto Systems", "flashcards": [{"front": "What is Public-key cryptography?", "back": "Key pair: public key for encrypt/verify; private key for decrypt/sign.", "detail": "2.2.4 · Principals of Public Key Crypto Systems"}, {"front": "What is Trapdoor one-way function?", "back": "Easy one way, hard to invert without trapdoor (private key).", "detail": "2.2.4 · Principals of Public Key Crypto Systems"}, {"front": "What is Key distribution relief?", "back": "No shared secret needed before first confidential message (vs symmetric).", "detail": "2.2.4 · Principals of Public Key Crypto Systems"}, {"front": "What is Hybrid encryption?", "back": "Use public-key to wrap a symmetric session key; bulk data uses AES/etc.", "detail": "2.2.4 · Principals of Public Key Crypto Systems"}, {"front": "Public-key ops are slower?", "back": "practically always hybrid with symmetric ciphers.", "detail": "2.2.4 · key idea"}, {"front": "What about Confidentiality?", "back": "encrypt with recipient’s public key; authenticity: sign with sender’s private key.", "detail": "2.2.4 · key idea"}], "mcqs": [{"q": "Which statement best matches Principals of Public Key Crypto Systems?", "options": ["Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Principals of Public Key Crypto Systems", "Unrelated to Module 2"], "answer": 2, "explain": "Principals of Public Key Crypto Systems is a syllabus topic under Public Key Cryptography in Module 2."}]}, {"id": "2.2.5", "title": "RSA Algorithm", "flashcards": [{"front": "What is RSA setup?", "back": "Choose primes p,q; n=pq; pick e with gcd(e,φ(n))=1; d≡e⁻¹ (mod φ(n)).", "detail": "2.2.5 · RSA Algorithm"}, {"front": "What is Encrypt?", "back": "C = M^e mod n (public: n,e).", "detail": "2.2.5 · RSA Algorithm"}, {"front": "What is Decrypt?", "back": "M = C^d mod n (private: d, and usually p,q).", "detail": "2.2.5 · RSA Algorithm"}, {"front": "What is φ(n)?", "back": "(p−1)(q−1) for distinct primes p,q.", "detail": "2.2.5 · RSA Algorithm"}, {"front": "What is Signing variant?", "back": "Sign with d; verify with e — same maths, different goal.", "detail": "2.2.5 · RSA Algorithm"}, {"front": "What about Correctness follows from Euler/Fermat?", "back": "M^{ed} ≡ M (mod n) under standard conditions.", "detail": "2.2.5 · key idea"}], "mcqs": [{"q": "Which statement best matches RSA Algorithm?", "options": ["A definition-only label with no role in Network Security & Cryptography", "Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: RSA Algorithm", "Unrelated to Module 2"], "answer": 2, "explain": "RSA Algorithm is a syllabus topic under Public Key Cryptography in Module 2."}]}, {"id": "2.2.6", "title": "Security of RSA Algorithm", "flashcards": [{"front": "What is Factoring threat?", "back": "If n=pq is factored, φ(n) and d are recovered — RSA breaks.", "detail": "2.2.6 · Security of RSA Algorithm"}, {"front": "What is Small/exponent attacks?", "back": "Bad choices (tiny e with small M, Wiener small-d) leak information.", "detail": "2.2.6 · Security of RSA Algorithm"}, {"front": "What is Common modulus?", "back": "Reusing n with different e’s for same M can be fatal.", "detail": "2.2.6 · Security of RSA Algorithm"}, {"front": "What is Side channels?", "back": "Timing/power on modular exponentiation can leak d.", "detail": "2.2.6 · Security of RSA Algorithm"}, {"front": "What is Padding necessity?", "back": "Textbook RSA without padding is insecure against multiple practical attacks.", "detail": "2.2.6 · Security of RSA Algorithm"}, {"front": "Key idea (Security of RSA Algorithm)", "back": "RSA security ≈ hardness of factoring n (and related RSA problems) under good parameters.", "detail": "2.2.6 · concept"}], "mcqs": [{"q": "Which statement best matches Security of RSA Algorithm?", "options": ["A core idea in Network Security & Cryptography: Security of RSA Algorithm", "Only a programming-language keyword with no syllabus meaning", "Unrelated to Module 2", "A definition-only label with no role in Network Security & Cryptography"], "answer": 0, "explain": "Security of RSA Algorithm is a syllabus topic under Public Key Cryptography in Module 2."}]}]}, {"id": 3, "title": "Module 3", "topics": [{"id": "3.1.1", "title": "Introduction of Message Authentication Codes", "flashcards": [{"front": "What is Message authentication?", "back": "Verify that a message is from the claimed sender and was not altered.", "detail": "3.1.1 · Introduction of Message Authentication Codes"}, {"front": "What is MAC (idea)?", "back": "Short authentication tag computed with a shared secret key.", "detail": "3.1.1 · Introduction of Message Authentication Codes"}, {"front": "What is Impersonation / alteration threats?", "back": "Active attacks that authentication aims to detect.", "detail": "3.1.1 · Introduction of Message Authentication Codes"}, {"front": "What is Secrecy vs authenticity?", "back": "Encryption alone does not always authenticate; auth alone does not encrypt.", "detail": "3.1.1 · Introduction of Message Authentication Codes"}, {"front": "Key idea (Introduction of Message Authentication Codes)", "back": "Introduces why confidentiality mechanisms are insufficient for integrity/origin.", "detail": "3.1.1 · concept"}, {"front": "Also remember (Introduction of Message Authentication Codes)", "back": "MACs are symmetric; digital signatures are asymmetric counterparts.", "detail": "3.1.1 · concept"}], "mcqs": [{"q": "Which statement best matches Introduction of Message Authentication Codes?", "options": ["Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Introduction of Message Authentication Codes", "A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 3"], "answer": 1, "explain": "Introduction of Message Authentication Codes is a syllabus topic under Message Authentication Codes in Module 3."}]}, {"id": "3.1.2", "title": "Authentication Functions", "flashcards": [{"front": "What is Authentication function?", "back": "Function producing an authenticator from message (±key/secret).", "detail": "3.1.2 · Authentication Functions"}, {"front": "What is Message encryption as authenticator?", "back": "Sometimes ciphertext itself is used — weak/ambiguous without structure.", "detail": "3.1.2 · Authentication Functions"}, {"front": "What is Message authentication code?", "back": "Keyed function; verifier recomputes tag with shared key.", "detail": "3.1.2 · Authentication Functions"}, {"front": "What is Hash function authenticator?", "back": "Unkeyed digest; needs additional binding (e.g. encrypt digest, or HMAC).", "detail": "3.1.2 · Authentication Functions"}, {"front": "What about Three classical textbook classes?", "back": "encryption, MAC, hash-based schemes.", "detail": "3.1.2 · key idea"}, {"front": "Hash alone is public?", "back": "attacker can recompute digest after modification.", "detail": "3.1.2 · key idea"}], "mcqs": [{"q": "Which statement best matches Authentication Functions?", "options": ["A core idea in Network Security & Cryptography: Authentication Functions", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 3"], "answer": 0, "explain": "Authentication Functions is a syllabus topic under Message Authentication Codes in Module 3."}]}, {"id": "3.1.3", "title": "Authentication Requirements", "flashcards": [{"front": "What is Disclosure protection?", "back": "Not the primary MAC goal — that’s confidentiality.", "detail": "3.1.3 · Authentication Requirements"}, {"front": "What is Content integrity?", "back": "Detect modification of message content.", "detail": "3.1.3 · Authentication Requirements"}, {"front": "What is Origin authentication?", "back": "Assure message originated from claimed sender.", "detail": "3.1.3 · Authentication Requirements"}, {"front": "What is Sequencing / timeliness?", "back": "Detect replay, reordering, delay when required by the application.", "detail": "3.1.3 · Authentication Requirements"}, {"front": "What is Non-repudiation (optional)?", "back": "Usually needs signatures/TTP — not provided by ordinary MAC.", "detail": "3.1.3 · Authentication Requirements"}, {"front": "What about Requirements depend on threat model?", "back": "integrity alone vs integrity+freshness.", "detail": "3.1.3 · key idea"}], "mcqs": [{"q": "Which statement best matches Authentication Requirements?", "options": ["Unrelated to Module 3", "A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Authentication Requirements", "Only a programming-language keyword with no syllabus meaning"], "answer": 2, "explain": "Authentication Requirements is a syllabus topic under Message Authentication Codes in Module 3."}]}, {"id": "3.1.4", "title": "Message Authentication Code (MAC)", "flashcards": [{"front": "What is MAC?", "back": "MAC_K(M) → tag; verify by recomputing and comparing tags.", "detail": "3.1.4 · Message Authentication Code (MAC)"}, {"front": "What is HMAC?", "back": "Keyed-hash MAC: hash with key mixed via ipad/opad construction.", "detail": "3.1.4 · Message Authentication Code (MAC)"}, {"front": "What is CBC-MAC / CMAC?", "back": "MAC from block cipher chaining (careful with variable-length messages).", "detail": "3.1.4 · Message Authentication Code (MAC)"}, {"front": "What is Forgery resistance?", "back": "Without K, producing a valid tag for a new message should be infeasible.", "detail": "3.1.4 · Message Authentication Code (MAC)"}, {"front": "Key idea (Message Authentication Code (MAC))", "back": "MAC uses shared secret → both sides can generate tags (no non-repudiation).", "detail": "3.1.4 · concept"}, {"front": "Truncating tags reduces security bits?", "back": "length is an exam parameter sometimes.", "detail": "3.1.4 · key idea"}], "mcqs": [{"q": "Which statement best matches Message Authentication Code (MAC)?", "options": ["Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 3", "A core idea in Network Security & Cryptography: Message Authentication Code (MAC)"], "answer": 3, "explain": "Message Authentication Code (MAC) is a syllabus topic under Message Authentication Codes in Module 3."}]}, {"id": "3.1.5", "title": "Secure Hash Algorithm (SHA)", "flashcards": [{"front": "What is SHA family?", "back": "Secure Hash Algorithm standards (SHA-1 legacy; SHA-2/SHA-3 modern).", "detail": "3.1.5 · Secure Hash Algorithm (SHA)"}, {"front": "What is SHA-1?", "back": "160-bit digest — collision-broken for practical attacks; avoid for new security.", "detail": "3.1.5 · Secure Hash Algorithm (SHA)"}, {"front": "What is SHA-256?", "back": "SHA-2 variant with 256-bit digest — common integrity workhorse.", "detail": "3.1.5 · Secure Hash Algorithm (SHA)"}, {"front": "What is One-way / compression?", "back": "Fixed-length output from arbitrary-length input via iterated compression.", "detail": "3.1.5 · Secure Hash Algorithm (SHA)"}, {"front": "What about Hash properties?", "back": "preimage, second-preimage, collision resistance.", "detail": "3.1.5 · key idea"}, {"front": "Also remember (Secure Hash Algorithm (SHA))", "back": "SHA used inside HMAC, digital signatures, and fingerprinting.", "detail": "3.1.5 · concept"}], "mcqs": [{"q": "Which statement best matches Secure Hash Algorithm (SHA)?", "options": ["A core idea in Network Security & Cryptography: Secure Hash Algorithm (SHA)", "Unrelated to Module 3", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography"], "answer": 0, "explain": "Secure Hash Algorithm (SHA) is a syllabus topic under Message Authentication Codes in Module 3."}]}, {"id": "3.1.6", "title": "Message Digest", "flashcards": [{"front": "What is Message digest?", "back": "Fixed-length hash output representing a message’s fingerprint.", "detail": "3.1.6 · Message Digest"}, {"front": "What is MD5?", "back": "128-bit digest — broken for collisions; legacy checksum only.", "detail": "3.1.6 · Message Digest"}, {"front": "What is Integrity check?", "back": "Compare digests to detect accidental/malicious change (if digest protected).", "detail": "3.1.6 · Message Digest"}, {"front": "What is Digest vs MAC?", "back": "Digest unkeyed; MAC keyed — digests alone don’t authenticate origin.", "detail": "3.1.6 · Message Digest"}, {"front": "Key idea (Message Digest)", "back": "“Message digest” often means the hash value in exam language (MD5/SHA).", "detail": "3.1.6 · concept"}, {"front": "Also remember (Message Digest)", "back": "Signing a digest is how practical digital signatures work on large files.", "detail": "3.1.6 · concept"}], "mcqs": [{"q": "Which statement best matches Message Digest?", "options": ["A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: Message Digest", "Only a programming-language keyword with no syllabus meaning", "Unrelated to Module 3"], "answer": 1, "explain": "Message Digest is a syllabus topic under Message Authentication Codes in Module 3."}]}, {"id": "3.2.1", "title": "Overview of Digital Signatures", "flashcards": [{"front": "What is Digital signature?", "back": "Asymmetric authenticator binding message to signer’s private key.", "detail": "3.2.1 · Overview of Digital Signatures"}, {"front": "What is Sign / Verify?", "back": "Sign with private key; verify with corresponding public key.", "detail": "3.2.1 · Overview of Digital Signatures"}, {"front": "What is Non-repudiation?", "back": "Signer cannot credibly deny the signature if private key was not compromised.", "detail": "3.2.1 · Overview of Digital Signatures"}, {"front": "What is Hash-then-sign?", "back": "Hash message first; sign the digest for efficiency.", "detail": "3.2.1 · Overview of Digital Signatures"}, {"front": "Key idea (Overview of Digital Signatures)", "back": "Signatures provide integrity + origin + non-repudiation; MACs do not give third-party non-repudiation.", "detail": "3.2.1 · concept"}, {"front": "Anyone with the public key can verify?", "back": "no shared secret required.", "detail": "3.2.1 · key idea"}], "mcqs": [{"q": "Which statement best matches Overview of Digital Signatures?", "options": ["A definition-only label with no role in Network Security & Cryptography", "Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Overview of Digital Signatures", "Unrelated to Module 3"], "answer": 2, "explain": "Overview of Digital Signatures is a syllabus topic under Digital Signatures in Module 3."}]}, {"id": "3.2.2", "title": "Digital Signature Standards (DSS)", "flashcards": [{"front": "What is DSS?", "back": "NIST Digital Signature Standard specifying approved signature algorithms.", "detail": "3.2.2 · Digital Signature Standards (DSS)"}, {"front": "What is DSA?", "back": "Digital Signature Algorithm (original DSS algorithm) based on discrete log in a subgroup.", "detail": "3.2.2 · Digital Signature Standards (DSS)"}, {"front": "What is Parameters?", "back": "Global domain parameters (p,q,g) plus per-user key pair.", "detail": "3.2.2 · Digital Signature Standards (DSS)"}, {"front": "What is Modern DSS scope?", "back": "May include DSA, RSA signatures, ECDSA depending on revision era.", "detail": "3.2.2 · Digital Signature Standards (DSS)"}, {"front": "Key idea (Digital Signature Standards (DSS))", "back": "DSS is the standard framework; DSA is a specific algorithm often taught under DSS.", "detail": "3.2.2 · concept"}, {"front": "DSA signatures use per-message randomness k?", "back": "reuse of k is catastrophic.", "detail": "3.2.2 · key idea"}], "mcqs": [{"q": "Which statement best matches Digital Signature Standards (DSS)?", "options": ["Unrelated to Module 3", "A core idea in Network Security & Cryptography: Digital Signature Standards (DSS)", "A definition-only label with no role in Network Security & Cryptography", "Only a programming-language keyword with no syllabus meaning"], "answer": 1, "explain": "Digital Signature Standards (DSS) is a syllabus topic under Digital Signatures in Module 3."}]}, {"id": "3.2.3", "title": "Proof of Digital Signature Algorithm", "flashcards": [{"front": "What is DSA signing?", "back": "Compute r from g^k mod p; s from k⁻¹(H(M)+x·r) mod q — schematic form.", "detail": "3.2.3 · Proof of Digital Signature Algorithm"}, {"front": "What is DSA verify?", "back": "Recompute using public y=g^x and check r matches reconstructed value.", "detail": "3.2.3 · Proof of Digital Signature Algorithm"}, {"front": "What is Correctness idea?", "back": "Verification equation holds iff s,r came from private x and hash H(M).", "detail": "3.2.3 · Proof of Digital Signature Algorithm"}, {"front": "What is Security basis?", "back": "Hardness of discrete logarithm in the chosen group.", "detail": "3.2.3 · Proof of Digital Signature Algorithm"}, {"front": "Key idea (Proof of Digital Signature Algorithm)", "back": "Proof/correctness shows verify accepts honest signatures and rejects altered M (w.h.p.).", "detail": "3.2.3 · concept"}, {"front": "Also remember (Proof of Digital Signature Algorithm)", "back": "Private key x never leaves the signer; public y is published.", "detail": "3.2.3 · concept"}], "mcqs": [{"q": "Which statement best matches Proof of Digital Signature Algorithm?", "options": ["A core idea in Network Security & Cryptography: Proof of Digital Signature Algorithm", "Only a programming-language keyword with no syllabus meaning", "A definition-only label with no role in Network Security & Cryptography", "Unrelated to Module 3"], "answer": 0, "explain": "Proof of Digital Signature Algorithm is a syllabus topic under Digital Signatures in Module 3."}]}]}, {"id": 4, "title": "Module 4", "topics": [{"id": "4.1.1", "title": "Authentication Applications: Kerberos", "flashcards": [{"front": "What is Kerberos?", "back": "Trusted third-party authentication protocol using tickets and symmetric crypto.", "detail": "4.1.1 · Authentication Applications: Kerberos"}, {"front": "What is KDC?", "back": "Key Distribution Center: Authentication Server (AS) + Ticket Granting Server (TGS).", "detail": "4.1.1 · Authentication Applications: Kerberos"}, {"front": "What is TGT?", "back": "Ticket-Granting Ticket — proves AS authentication to obtain service tickets.", "detail": "4.1.1 · Authentication Applications: Kerberos"}, {"front": "What is Service ticket?", "back": "Credential presented to an application server for access.", "detail": "4.1.1 · Authentication Applications: Kerberos"}, {"front": "What is Authenticator?", "back": "Fresh encrypted blob (timestamp) proving possession of session key — anti-replay.", "detail": "4.1.1 · Authentication Applications: Kerberos"}, {"front": "Key idea (Authentication Applications: Kerberos)", "back": "Client authenticates to AS → TGT → TGS issues service ticket → server verifies.", "detail": "4.1.1 · concept"}], "mcqs": [{"q": "Which statement best matches Authentication Applications: Kerberos?", "options": ["Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Authentication Applications: Kerberos", "Unrelated to Module 4", "A definition-only label with no role in Network Security & Cryptography"], "answer": 1, "explain": "Authentication Applications: Kerberos is a syllabus topic under Introduction to Web Security in Module 4."}]}, {"id": "4.1.2", "title": "Overview of Access Control List (ACL)", "flashcards": [{"front": "What is ACL?", "back": "Access Control List: permissions attached to an object listing allowed subjects/actions.", "detail": "4.1.2 · Overview of Access Control List (ACL)"}, {"front": "What is Subject / Object?", "back": "Active entity (user/process) / passive resource (file, socket).", "detail": "4.1.2 · Overview of Access Control List (ACL)"}, {"front": "What is Access right?", "back": "Operation permitted: read, write, execute, delete, etc.", "detail": "4.1.2 · Overview of Access Control List (ACL)"}, {"front": "What is Capability (contrast)?", "back": "Unforgeable token held by subject naming allowed object operations.", "detail": "4.1.2 · Overview of Access Control List (ACL)"}, {"front": "What is DAC flavour?", "back": "Owner-controlled ACLs are common discretionary access control realisation.", "detail": "4.1.2 · Overview of Access Control List (ACL)"}, {"front": "ACL is object-centric; capability list is subject-centric?", "back": "dual views of an access matrix.", "detail": "4.1.2 · key idea"}], "mcqs": [{"q": "Which statement best matches Overview of Access Control List (ACL)?", "options": ["Unrelated to Module 4", "A definition-only label with no role in Network Security & Cryptography", "Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Overview of Access Control List (ACL)"], "answer": 3, "explain": "Overview of Access Control List (ACL) is a syllabus topic under Introduction to Web Security in Module 4."}]}, {"id": "4.1.3", "title": "Electronic Mail Security: Pretty Good Privacy (PGP)", "flashcards": [{"front": "What is PGP?", "back": "Pretty Good Privacy — email/file encryption and signing with hybrid crypto.", "detail": "4.1.3 · Electronic Mail Security: Pretty Good Privacy (PGP)"}, {"front": "What is Web of trust?", "back": "Users sign others’ keys; trust is decentralised, not only CA-based.", "detail": "4.1.3 · Electronic Mail Security: Pretty Good Privacy (PGP)"}, {"front": "What is Session key?", "back": "Random symmetric key encrypts the message; RSA/ElGamal wraps that key.", "detail": "4.1.3 · Electronic Mail Security: Pretty Good Privacy (PGP)"}, {"front": "What is Signature in PGP?", "back": "Hash of message signed with sender’s private key for authenticity.", "detail": "4.1.3 · Electronic Mail Security: Pretty Good Privacy (PGP)"}, {"front": "What is Key rings?", "back": "Local collections of public/private keys and trust metadata.", "detail": "4.1.3 · Electronic Mail Security: Pretty Good Privacy (PGP)"}, {"front": "What about Confidentiality?", "back": "symmetric bulk + public-key wrap; authenticity: detached/inline signatures.", "detail": "4.1.3 · key idea"}], "mcqs": [{"q": "Which statement best matches Electronic Mail Security: Pretty Good Privacy (PGP)?", "options": ["Unrelated to Module 4", "A definition-only label with no role in Network Security & Cryptography", "Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Electronic Mail Security: Pretty Good Privacy (PGP)"], "answer": 3, "explain": "Electronic Mail Security: Pretty Good Privacy (PGP) is a syllabus topic under Introduction to Web Security in Module 4."}]}, {"id": "4.1.4", "title": "S/MIME", "flashcards": [{"front": "What is S/MIME?", "back": "Secure/Multipurpose Internet Mail Extensions — MIME + crypto based on PKI.", "detail": "4.1.4 · S/MIME"}, {"front": "What is X.509 certificates?", "back": "CA-issued bindings of identity to public keys used by S/MIME.", "detail": "4.1.4 · S/MIME"}, {"front": "What is Enveloped data?", "back": "Encrypted content for confidentiality.", "detail": "4.1.4 · S/MIME"}, {"front": "What is Signed data?", "back": "Cryptographic signature over MIME entities for authenticity/integrity.", "detail": "4.1.4 · S/MIME"}, {"front": "Key idea (S/MIME)", "back": "S/MIME integrates with existing CA hierarchies familiar to enterprises.", "detail": "4.1.4 · concept"}, {"front": "Also remember (S/MIME)", "back": "Same hybrid crypto idea as PGP, different trust and formatting model.", "detail": "4.1.4 · concept"}], "mcqs": [{"q": "Which statement best matches S/MIME?", "options": ["Unrelated to Module 4", "A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: S/MIME", "Only a programming-language keyword with no syllabus meaning"], "answer": 2, "explain": "S/MIME is a syllabus topic under Introduction to Web Security in Module 4."}]}, {"id": "4.2.1", "title": "IP Security Architecture Components", "flashcards": [{"front": "What is IPsec?", "back": "Security architecture for the Internet Protocol — AH, ESP, and key management.", "detail": "4.2.1 · IP Security Architecture Components"}, {"front": "What is AH?", "back": "Authentication Header — integrity/authenticity of IP packet parts (no encryption).", "detail": "4.2.1 · IP Security Architecture Components"}, {"front": "What is ESP?", "back": "Encapsulating Security Payload — confidentiality ± integrity for payload.", "detail": "4.2.1 · IP Security Architecture Components"}, {"front": "What is SA / SPD?", "back": "Security Association (crypto params) / Security Policy Database (what to protect).", "detail": "4.2.1 · IP Security Architecture Components"}, {"front": "What is Transport vs tunnel?", "back": "Protect upper-layer payload vs encapsulate whole IP packet (VPN-style).", "detail": "4.2.1 · IP Security Architecture Components"}, {"front": "IPsec operates at network layer?", "back": "transparent to many apps.", "detail": "4.2.1 · key idea"}], "mcqs": [{"q": "Which statement best matches IP Security Architecture Components?", "options": ["A definition-only label with no role in Network Security & Cryptography", "A core idea in Network Security & Cryptography: IP Security Architecture Components", "Unrelated to Module 4", "Only a programming-language keyword with no syllabus meaning"], "answer": 1, "explain": "IP Security Architecture Components is a syllabus topic under IP Security in Module 4."}]}, {"id": "4.2.2", "title": "Secure Socket Layer", "flashcards": [{"front": "What is SSL/TLS?", "back": "Secure transport-layer protocol providing confidentiality, integrity, and authentication.", "detail": "4.2.2 · Secure Socket Layer"}, {"front": "What is Handshake?", "back": "Negotiate version/ciphers, authenticate (usually server cert), derive session keys.", "detail": "4.2.2 · Secure Socket Layer"}, {"front": "What is Record protocol?", "back": "Fragments, optionally compresses, MACs, and encrypts application data.", "detail": "4.2.2 · Secure Socket Layer"}, {"front": "What is Certificates?", "back": "X.509 server (and optional client) certificates bind names to public keys.", "detail": "4.2.2 · Secure Socket Layer"}, {"front": "SSL is historical name; TLS is the standardised successor?", "back": "exams often say SSL loosely.", "detail": "4.2.2 · key idea"}, {"front": "What about Ends at transport?", "back": "protects hop to the server, not necessarily end-to-end through intermediaries.", "detail": "4.2.2 · key idea"}], "mcqs": [{"q": "Which statement best matches Secure Socket Layer?", "options": ["Only a programming-language keyword with no syllabus meaning", "A core idea in Network Security & Cryptography: Secure Socket Layer", "Unrelated to Module 4", "A definition-only label with no role in Network Security & Cryptography"], "answer": 1, "explain": "Secure Socket Layer is a syllabus topic under IP Security in Module 4."}]}, {"id": "4.2.3", "title": "Secure electronic transaction (SET)", "flashcards": [{"front": "What is SET?", "back": "Secure Electronic Transaction — payment-card purchase protocol with dual signatures.", "detail": "4.2.3 · Secure electronic transaction (SET)"}, {"front": "What is Dual signature?", "back": "Links order info for merchant and payment info for bank without cross-revealing.", "detail": "4.2.3 · Secure electronic transaction (SET)"}, {"front": "What is Payment gateway?", "back": "Interface between merchant and card issuer/acquirer networks.", "detail": "4.2.3 · Secure electronic transaction (SET)"}, {"front": "What is Certificates?", "back": "Cardholder, merchant, and bank certificates in the SET PKI.", "detail": "4.2.3 · Secure electronic transaction (SET)"}, {"front": "What about SET aims?", "back": "authenticate parties, protect payment data, ensure integrity, privacy split mer const bank = [];
DATA.modules.forEach(m => {
  m.topics.forEach(t => {
    (t.mcqs || []).forEach((q, i) => {
      bank.push({
        moduleId: m.id,
        moduleTitle: m.title,
        topicId: t.id,
        topicTitle: t.title,
        q: q.q,
        options: q.options,
        answer: q.answer,
        explain: q.explain || "",
        id: m.id + "-" + t.id + "-q" + i
      });
    });
  });
});

let activeModule = "all";
let order = bank.map((_, i) => i);
let filteredIds = order.slice();
let index = 0;
const state = {};
let restoring = false;

const el = id => document.getElementById(id);
const quizProgressBar = el("quizProgressBar");

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentList() { return filteredIds.map(i => bank[i]); }

function persistQuiz() {
  if (restoring) return;
  const P = window.AmityProgress || window.BS605Progress;
  if (!P || !window.__AMITY_SYNC_READY) return;
  P.saveSection("quiz", {
    activeModule: String(activeModule),
    index: index,
    answers: { ...state },
    filteredIds: filteredIds.slice(),
    order: order.slice()
  });
}

function restoreQuiz(payload) {
  if (!payload || !payload.quiz) return;
  restoring = true;
  const q = payload.quiz;
  if (q.activeModule !== undefined) activeModule = String(q.activeModule);
  Object.keys(state).forEach(k => delete state[k]);
  if (q.answers && typeof q.answers === "object") {
    Object.entries(q.answers).forEach(([k, v]) => { state[k] = v; });
  }
  if (Array.isArray(q.order) && q.order.length === bank.length) order = q.order.slice();
  applyFilter(true);
  if (Array.isArray(q.filteredIds) && q.filteredIds.length) {
    const allowed = new Set(bank.map((_, i) => i).filter(i => activeModule === "all" || String(bank[i].moduleId) === String(activeModule)));
    filteredIds = q.filteredIds.filter(i => allowed.has(i));
    if (!filteredIds.length) applyFilter(false);
  }
  if (typeof q.index === "number" && filteredIds.length) {
    index = Math.max(0, Math.min(filteredIds.length - 1, q.index));
  }
  el("totalQ").textContent = filteredIds.length;
  renderFilters();
  renderStats();
  renderQuestion();
  updateScore();
  restoring = false;
}

function applyFilter(preserveShuffle=false) {
  const base = bank.map((q, i) => ({q, i})).filter(x => activeModule === "all" || String(x.q.moduleId) === String(activeModule)).map(x => x.i);
  filteredIds = preserveShuffle ? order.filter(i => base.includes(i)) : base;
  if (!preserveShuffle) order = bank.map((_, i) => i);
  index = 0;
  el("totalQ").textContent = filteredIds.length;
  renderFilters();
  renderStats();
  renderQuestion();
  updateScore();
  persistQuiz();
}

function renderFilters() {
  const box = el("moduleFilters");
  const mods = [{id:"all", title:"All modules"}, ...DATA.modules.map(m => ({id:String(m.id), title:"Module "+m.id}))];
  box.innerHTML = mods.map(m => `<button type="button" class="chip ${String(activeModule)===String(m.id)?"active":""}" data-m="${m.id}">${m.title}</button>`).join("");
  box.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    activeModule = btn.dataset.m;
    applyFilter(false);
  }));
}

function renderStats() {
  const box = el("moduleStats");
  box.innerHTML = DATA.modules.map(m => {
    const qs = bank.filter(q => q.moduleId === m.id);
    const attempted = qs.filter(q => state[q.id] !== undefined).length;
    const correct = qs.filter(q => state[q.id] === q.answer).length;
    const pct = qs.length ? Math.round((attempted / qs.length) * 100) : 0;
    return `<div class="stat"><b>${correct}/${qs.length}</b><span>Module ${m.id} · ${attempted} answered</span><div class="prog-line"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
}

function updateScore() {
  const list = currentList();
  const attempted = list.filter(q => state[q.id] !== undefined).length;
  const correct = list.filter(q => state[q.id] === q.answer).length;
  el("attempted").textContent = attempted;
  el("scoreNow").textContent = correct;
  el("accuracy").textContent = attempted ? Math.round((correct / attempted) * 100) + "%" : "—";
  quizProgressBar.style.width = list.length ? ((attempted / list.length) * 100) + "%" : "0%";
  renderStats();
}

function renderQuestion() {
  const list = currentList();
  if (!list.length) {
    el("qtext").textContent = "No questions in this filter.";
    el("options").innerHTML = "";
    el("explain").classList.remove("show");
    el("qnum").textContent = "";
    return;
  }
  const q = list[index];
  el("qnum").textContent = `Question ${index+1} of ${list.length}`;
  el("qtopic").textContent = `M${q.moduleId} · ${q.topicId} · ${q.topicTitle}`;
  el("qtext").textContent = q.q;
  const chosen = state[q.id];
  const letters = ["A","B","C","D"];
  el("options").innerHTML = q.options.map((opt, i) => {
    let cls = "opt";
    if (chosen !== undefined) {
      if (i === q.answer) cls += " correct";
      else if (i === chosen) cls += " wrong";
    }
    return `<button type="button" class="${cls}" data-i="${i}" ${chosen!==undefined?"disabled":""}><span class="letter">${letters[i]}</span><span>${opt.replace(/^[A-D]\.\s*/, "")}</span></button>`;
  }).join("");
  el("options").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    state[q.id] = Number(btn.dataset.i);
    renderQuestion();
    updateScore();
    persistQuiz();
  }));
  const explain = el("explain");
  if (chosen !== undefined) {
    const ok = chosen === q.answer;
    explain.textContent = (ok ? "Correct. " : "Not quite. ") + (q.explain || "");
    explain.classList.add("show");
  } else {
    explain.classList.remove("show");
    explain.textContent = "";
  }
}

el("nextBtn").addEventListener("click", () => {
  const list = currentList();
  if (!list.length) return;
  index = (index + 1) % list.length;
  renderQuestion();
  persistQuiz();
});
el("prevBtn").addEventListener("click", () => {
  const list = currentList();
  if (!list.length) return;
  index = (index - 1 + list.length) % list.length;
  renderQuestion();
  persistQuiz();
});
el("resetBtn").addEventListener("click", () => {
  Object.keys(state).forEach(k => delete state[k]);
  updateScore();
  renderQuestion();
  persistQuiz();
});
el("shuffleBtn").addEventListener("click", () => {
  const base = bank.map((q, i) => i).filter(i => activeModule === "all" || String(bank[i].moduleId) === String(activeModule));
  filteredIds = shuffle(base);
  order = shuffle(bank.map((_, i) => i));
  index = 0;
  renderQuestion();
  persistQuiz();
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") el("nextBtn").click();
  if (e.key === "ArrowLeft") el("prevBtn").click();
  const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  if (map[e.key.toLowerCase()] !== undefined) {
    const btn = el("options").querySelector(`[data-i="${map[e.key.toLowerCase()]}"]`);
    if (btn && !btn.disabled) btn.click();
  }
});

applyFilter(false);

function bootSync(restoreFn) {
  const SUBJECT = "csit654";
  function apply(subPayload) {
    if (subPayload && restoreFn) restoreFn(subPayload);
    window.__AMITY_SYNC_READY = true;
    window.__BS605_SYNC_READY = true;
  }
  const P = window.AmityProgress || window.BS605Progress;
  const UI = window.AmitySyncUI || window.BS605SyncUI;
  if (UI) {
    UI.mount(document.getElementById("amity-sync-root"), {
      subjectLabel: "CSIT654",
      onLoaded: (sub) => apply(sub),
      onReady: (sub) => {
        if (window.__AMITY_SYNC_READY) return;
        const local = P && P.readLocalCache && P.readLocalCache();
        const fallback = sub || (P && P.getSubjectPayload && P.getSubjectPayload(local?.payload, SUBJECT)) || null;
        apply(fallback);
      }
    });
  } else {
    const local = P && P.readLocalCache && P.readLocalCache();
    apply(P && P.getSubjectPayload ? P.getSubjectPayload(local?.payload, SUBJECT) : null);
  }
}

bootSync(restoreQuiz);
</script>
